name: App checks

# Unit tests plus the UX matrix: every screen and one quest per question format,
# in portrait and landscape, on six iPhone/iPad simulators. See scripts/ux-matrix/.
on:
  workflow_dispatch:
    inputs:
      devices:
        description: Devices to check, space-separated (empty for all six), e.g. "iphone-small ipad-mini"
        type: string
        default: ""
      tests:
        description: Layout tests to run, space-separated (empty for all), e.g. "testCoreFlowLayouts"
        type: string
        default: ""
      publish:
        description: Publish the screenshot report to the ux-matrix-report branch
        type: boolean
        default: true
  pull_request:
    paths:
      - MathQuestKids/**
      - MathQuestKidsTests/**
      - MathQuestKidsUITests/**
      - MathQuestKids.xcodeproj/**
      - MathQuestKids-Info.plist
      - scripts/ux-matrix/**
      - .github/workflows/app-checks.yml
  push:
    branches: [main, "claude/**"]
    paths:
      - MathQuestKids/**
      - MathQuestKidsTests/**
      - MathQuestKidsUITests/**
      - MathQuestKids.xcodeproj/**
      - MathQuestKids-Info.plist
      - scripts/ux-matrix/**
      - .github/workflows/app-checks.yml
  schedule:
    # Weekly, so layout regressions from new simulator/OS releases show up on their own.
    - cron: "23 9 * * 1"

concurrency:
  group: app-checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Picks the devices and layout tests. Everything by default; a manual run's inputs, or a
  # "UX-Matrix:" line in a pushed commit's message, can narrow it for a quicker check, e.g.
  #   UX-Matrix: iphone-small testCoreFlowLayouts
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      devices: ${{ steps.plan.outputs.devices }}
      tests: ${{ steps.plan.outputs.tests }}
      partial: ${{ steps.plan.outputs.partial }}
    steps:
      - id: plan
        env:
          DEVICES: ${{ inputs.devices }}
          TESTS: ${{ inputs.tests }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        shell: python3 {0}
        run: |
          import json, os, re, sys

          every_device = ["iphone-small", "iphone-standard", "iphone-large", "ipad-mini", "ipad-standard", "ipad-large"]
          words = f"{os.environ['DEVICES']} {os.environ['TESTS']}".split()
          line = re.search(r"^UX-Matrix:(.*)$", os.environ["COMMIT_MESSAGE"], re.MULTILINE)
          if line:
              words += line.group(1).split()
          unknown = [w for w in words if w not in every_device and not w.startswith("test")]
          if unknown:
              sys.exit(f"Not a device or test: {' '.join(unknown)}. Devices: {' '.join(every_device)}")
          devices = [d for d in every_device if d in words] or every_device
          tests = list(dict.fromkeys(w for w in words if w.startswith("test")))
          partial = devices != every_device or bool(tests)
          print(f"Devices: {' '.join(devices)}\nTests: {' '.join(tests) or 'all'}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"devices={json.dumps(devices)}\n")
              out.write(f"tests={' '.join(tests)}\n")
              out.write(f"partial={str(partial).lower()}\n")

  unit-tests:
    name: Unit tests
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Select newest Xcode 26
        run: |
          xcode="$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          sudo xcode-select -s "$xcode"
          xcodebuild -version

      - name: Run unit tests
        run: |
          udid="$(python3 scripts/ux-matrix/pick_simulators.py iphone-standard | cut -f2)"
          set +e
          xcodebuild test \
            -project MathQuestKids.xcodeproj \
            -scheme MathQuestKids \
            -destination "id=$udid" \
            -only-testing:MathQuestKidsTests \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO \
            > "$RUNNER_TEMP/unit-tests.log" 2>&1
          status=$?
          set -e
          grep -E "error:|✘|✔ Suite|Test run with|\*\* TEST|Executed" "$RUNNER_TEMP/unit-tests.log" | tail -120 || true
          exit $status

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: unit-tests-log
          path: ${{ runner.temp }}/unit-tests.log
          retention-days: 14

  layout:
    name: Layout (${{ matrix.device }})
    needs: plan
    runs-on: macos-26
    # Per-test limits in run.sh stop a stuck test well before this, so results still upload.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        device: ${{ fromJSON(needs.plan.outputs.devices) }}
    steps:
      - uses: actions/checkout@v7

      - name: Select newest Xcode 26
        run: |
          xcode="$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          sudo xcode-select -s "$xcode"
          xcodebuild -version

      - name: Run layout matrix
        env:
          OUT_DIR: ${{ runner.temp }}/ux
          # Empty runs every layout test.
          TESTS: ${{ needs.plan.outputs.tests }}
        run: scripts/ux-matrix/run.sh ${{ matrix.device }}

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ux-${{ matrix.device }}
          path: |
            ${{ runner.temp }}/ux/devices
            ${{ runner.temp }}/ux/results/*.log
            ${{ runner.temp }}/ux/build.log
          if-no-files-found: warn
          retention-days: 14

  report:
    name: UX report
    needs: [plan, layout]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: ux-*
          path: ${{ runner.temp }}/artifacts
          merge-multiple: true

      - name: Build report
        run: |
          python3 scripts/ux-matrix/make_report.py render \
            --devices "$RUNNER_TEMP/artifacts/devices" \
            --out "$RUNNER_TEMP/report" \
            --summary "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: ux-matrix-report
          path: ${{ runner.temp }}/report
          retention-days: 30

      # A single force-pushed commit, so screenshots never pile up in history. A narrowed run
      # replaces it too, so the branch always shows the latest run; its summary lists the devices.
      - name: Publish to ux-matrix-report branch
        if: github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.publish)
        env:
          GH_TOKEN: ${{ github.token }}
          PARTIAL: ${{ needs.plan.outputs.partial }}
        run: |
          cd "$RUNNER_TEMP/report"
          git init -q -b ux-matrix-report
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          scope="all devices"
          if [[ "$PARTIAL" == "true" ]]; then scope="partial run"; fi
          git commit -q -m "UX matrix report for ${GITHUB_SHA::7} on ${GITHUB_REF_NAME} (${scope})"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ux-matrix-report
